<svg xmlns="http://www.w3.org/2000/svg" width="42" height="24" viewBox="0 0 42 24">
  <style>
    @keyframes d1 {
      0%{fill-opacity:1} 16.6%{fill-opacity:1} 33.3%{fill-opacity:0.3} 50%{fill-opacity:0.3} 66.6%{fill-opacity:0.3} 83.3%{fill-opacity:1} 100%{fill-opacity:1}
    }
    @keyframes d2 {
      0%{fill-opacity:0.6} 16.6%{fill-opacity:1} 33.3%{fill-opacity:1} 50%{fill-opacity:0.3} 66.6%{fill-opacity:0.3} 83.3%{fill-opacity:0.3} 100%{fill-opacity:0.6}
    }
    @keyframes d3 {
      0%{fill-opacity:1} 16.6%{fill-opacity:0.3} 33.3%{fill-opacity:0.3} 50%{fill-opacity:0.3} 66.6%{fill-opacity:1} 83.3%{fill-opacity:1} 100%{fill-opacity:1}
    }
  </style>
  <circle cx="9" cy="12" r="3" fill="#9CA3AF" style="animation:d1 1.8s ease-in-out infinite"/>
  <circle cx="21" cy="12" r="3" fill="#9CA3AF" style="animation:d2 1.8s ease-in-out infinite"/>
  <circle cx="33" cy="12" r="3" fill="#9CA3AF" style="animation:d3 1.8s ease-in-out infinite"/>
