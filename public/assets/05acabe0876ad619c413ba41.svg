    @keyframes b1 { 0%,100%{height:6.67px;y:4.67px} 25%{height:11.67px;y:2.17px} 50%{height:6.67px;y:4.67px} 75%{height:3.33px;y:6.33px} }
    @keyframes b2 { 0%,100%{height:11.67px;y:2.17px} 25%{height:6.67px;y:4.67px} 50%{height:3.33px;y:6.33px} 75%{height:1.67px;y:7.17px} }
    @keyframes b3 { 0%,100%{height:3.33px;y:6.33px} 25%{height:8.33px;y:3.83px} 50%{height:11.67px;y:2.17px} 75%{height:6.67px;y:4.67px} }
